[project]
name = "qt-material-icons"
version = "0.5.2"
description = "Material Symbols by Google for Qt using PySide"
authors = [
    {name = "Beat Reichenbach"}
]
requires-python = ">=3.6"
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "PySide6",
    "pytest>=8.0",
    "python-semantic-release>=9.0",
    "qtpy>=2.0,<3",
    "qt_themes>=0.4",
    "ruff>=0.16",
    "ty>=0.0.82",
]
pyside2 = ["PySide2"]
pyside6 = ["PySide6"]
qtpy = ["qtpy>=2.0,<3"]

[project.scripts]
qtmaterialicons = "qt_material_icons.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["qt_material_icons"]

[tool.setuptools.package-data]
"qt_material_icons" = ["py.typed", "resources/*.py"]

[tool.semantic_release]
allow_zero_version = true
version_variables = ["qt_material_icons/__init__.py:__version__"]
version_toml  = ["pyproject.toml:project.version"]

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.uv]
environments = ["python_full_version >= '3.9'"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["qt_material_icons/resources"]
force-exclude = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["SIM108"]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
exclude = ["qt_material_icons/resources"]

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
